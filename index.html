<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="can-style.css" />
  </head>
  <body>
    <header>
      <h1>The Can Store</h1>
    </header>
    <div>
      <aside>
        <form>
          <div>
            <label for="category">Choose a category:</label>
            <select id="category">
              <option selected>All</option>
              <option>Vegetables</option>
              <option>Meat</option>
              <option>Soup</option>
            </select>
          </div>
          <div>
            <label for="search">Enter search term:</label>
            <input
              type="text"
              id="search"
              name="search"
              placeholder="e.g.beans"
            />
          </div>
          <div>
            <button>Filter results</button>
          </div>
        </form>
      </aside>
      <main></main>
    </div>
    <footer>
      <p>All icons found at the Noun Project:</p>
      <ul>
        <li>Vegetable icon by Ricardo Moreira</li>
        <li>Bean can icon by Yazmin Alanis</li>
        <li>Soup icon by Arthur Shlain</li>
        <li>Meat Chunk icon by Oliviu Stoian.</li>
      </ul>
    </footer>
    <script src="can-script.js"></script>
  </body>
</html>
